<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>國中英文每日任務 · 點擊作答</title>
<style>
  :root{--bg:#0f1720;--panel:#182430;--panel2:#1f2e3c;--line:rgba(255,255,255,.12);
    --text:#eef4f8;--muted:#9db1c2;--accent:#3ba0ff;--green:#2ecc71;--red:#ff5b6b;--gold:#ffcf4d;--purple:#b98cff;}
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:"Segoe UI","Noto Sans TC","Microsoft JhengHei",system-ui,sans-serif;
    background:linear-gradient(160deg,#0f1720,#10202c 60%,#0c1a24);color:var(--text);
    min-height:100vh;line-height:1.7;-webkit-font-smoothing:antialiased}
  .wrap{max-width:820px;margin:0 auto;padding:20px 16px 80px}
  header{text-align:center;padding:10px 0 6px}
  .logo{font-size:24px;font-weight:800;letter-spacing:1px}
  .logo small{display:block;font-size:12px;color:var(--muted);font-weight:600;margin-top:2px;letter-spacing:2px}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:18px;margin-top:16px;
    box-shadow:0 12px 40px rgba(0,0,0,.35)}
  .board{display:flex;gap:10px;flex-wrap:wrap;align-items:center;background:linear-gradient(90deg,#183042,#1c2a3a);
    border:1px solid rgba(59,160,255,.35)}
  .stat{flex:1;min-width:120px;text-align:center}
  .stat .n{font-size:22px;font-weight:800;color:var(--gold)}
  .stat .l{font-size:11.5px;color:var(--muted)}
  .redeem-row{display:flex;gap:6px;align-items:center}
  .redeem-in{width:92px;padding:8px 10px;border-radius:9px;border:1px solid var(--line);background:rgba(0,0,0,.3);color:var(--text);font-size:14px;font-weight:700}
  .redeem-in:disabled{opacity:.5}
  .redeem-btn{background:var(--gold);color:#3a2c00;border:none;border-radius:10px;padding:9px 14px;font-weight:800;cursor:pointer;font-size:13px;white-space:nowrap}
  .redeem-btn:disabled{opacity:.5;cursor:not-allowed}
  .hint{color:var(--muted);font-size:12px;flex-basis:100%;text-align:center;margin-top:2px}
  .badge{display:inline-block;font-size:12px;font-weight:700;padding:3px 10px;border-radius:99px;
    background:rgba(59,160,255,.2);border:1px solid rgba(59,160,255,.5);color:#bfe0ff}
  h2{font-size:20px;margin:8px 0 2px}
  .sub{color:var(--muted);font-size:13px;margin-bottom:8px}
  .passage{white-space:pre-wrap;font-size:15.5px;line-height:1.95;text-align:justify;
    background:rgba(0,0,0,.2);border:1px solid var(--line);border-radius:12px;padding:14px;margin-top:8px}
  details{margin-top:12px;border:1px solid var(--line);border-radius:12px;overflow:hidden;background:rgba(0,0,0,.15)}
  details summary{cursor:pointer;padding:10px 14px;font-weight:700;color:var(--gold);list-style:none}
  details summary::-webkit-details-marker{display:none}
  .dbody{padding:6px 14px 12px}
  /* 單字卡（含例句與播音） */
  .vcard{border-bottom:1px dashed var(--line);padding:9px 0}
  .vcard:last-child{border-bottom:none}
  .vhead{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
  .vhead b{color:#7fd3ff;font-size:15.5px}
  .vhead .pos{color:var(--muted);font-size:12px}
  .vhead .d{font-size:14px}
  .vex{display:flex;align-items:flex-start;gap:8px;margin-top:4px;color:var(--muted);font-size:13.5px;font-style:italic}
  .spk{flex:none;width:26px;height:26px;border-radius:50%;border:1px solid var(--line);background:rgba(185,140,255,.16);
    color:var(--purple);cursor:pointer;font-size:13px;display:grid;place-items:center;padding:0}
  .spk:hover{border-color:var(--purple);background:rgba(185,140,255,.28)}
  .spk:active{transform:scale(.9)}
  .gr{font-size:14px;margin:4px 0;padding-left:6px}
  /* 分區 */
  .sec{margin-top:18px}
  .sec-h{font-size:16px;font-weight:800;padding:8px 12px;border-radius:10px;display:flex;align-items:center;gap:8px}
  .sec-h.reading{background:rgba(59,160,255,.16);color:#bfe0ff}
  .sec-h.grammar{background:rgba(46,204,113,.16);color:#a9edc7}
  .sec-h.vocab{background:rgba(185,140,255,.16);color:#dcc7ff}
  .sec-h .cnt{margin-left:auto;font-size:12px;color:var(--muted);font-weight:600}
  .q{margin-top:12px;padding-top:10px;border-top:1px dashed var(--line)}
  .q:first-of-type{border-top:none}
  .q-h{font-weight:700;font-size:15.5px;margin-bottom:9px}
  .q-h .num{display:inline-grid;place-items:center;width:24px;height:24px;border-radius:50%;
    background:var(--accent);color:#04203a;font-size:13px;font-weight:800;margin-right:8px}
  .opt{display:flex;gap:10px;align-items:flex-start;border:1px solid var(--line);border-radius:11px;
    padding:10px 12px;margin:7px 0;cursor:pointer;background:var(--panel2);transition:.12s}
  .opt:hover{border-color:var(--accent)}
  .opt .k{width:24px;height:24px;flex:none;border-radius:7px;background:rgba(255,255,255,.1);display:grid;place-items:center;font-weight:800;font-size:13px}
  .opt.sel{border-color:var(--accent);background:rgba(59,160,255,.14)}
  .opt.correct{border-color:var(--green);background:rgba(46,204,113,.16)}
  .opt.correct .k{background:var(--green);color:#053}
  .opt.wrong{border-color:var(--red);background:rgba(255,91,107,.16)}
  .opt.wrong .k{background:var(--red)}
  .opt.locked{cursor:default}
  .ex{display:none;font-size:13.5px;color:var(--muted);margin-top:6px;padding:8px 10px;background:rgba(0,0,0,.22);border-radius:8px}
  .ex.show{display:block}
  .btn{display:block;width:100%;margin-top:18px;border:none;border-radius:12px;padding:14px;font-size:16px;font-weight:800;cursor:pointer;color:#04203a;background:linear-gradient(90deg,var(--accent),#63c0ff)}
  .btn:disabled{opacity:.5;cursor:not-allowed}
  .btn.ghost{background:transparent;border:1px solid var(--line);color:var(--text)}
  .subcount{text-align:center;color:var(--muted);font-size:13px;margin-top:8px}
  .result{text-align:center;margin-top:16px;padding:16px;border-radius:14px;display:none}
  .result.show{display:block}
  .result.pass{background:rgba(46,204,113,.14);border:1px solid rgba(46,204,113,.5)}
  .result.fail{background:rgba(255,91,107,.14);border:1px solid rgba(255,91,107,.5)}
  .result .big{font-size:40px}
  .result .score{font-size:26px;font-weight:800;color:var(--gold)}
  .breakdown{font-size:13px;color:var(--muted);margin-top:6px}
  .row{display:flex;gap:10px;margin-top:12px}.row .btn{margin-top:0}
  .makeup-item{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:10px 12px;margin:6px 0;
    border:1px solid var(--line);border-radius:10px;background:var(--panel2);cursor:pointer;font-size:14px}
  .makeup-item:hover{border-color:var(--accent)}
  .makeup-item .go{flex:none;color:var(--accent);font-weight:700;font-size:13px}
  .back-btn{display:inline-block;width:auto;padding:6px 12px;margin-top:6px;font-size:13px}
  .ptable{width:100%;border-collapse:collapse;font-size:13px;margin-top:8px;white-space:nowrap}
  .ptable th,.ptable td{padding:6px 8px;border-bottom:1px dashed var(--line);text-align:left}
  .ptable th{color:var(--muted);font-weight:600;font-size:12px}
  .pscroll{overflow-x:auto}
  .week{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap}
  .wd{flex:1;min-width:56px;text-align:center;border:1px solid var(--line);border-radius:10px;padding:6px 4px;font-size:12px;background:var(--panel2)}
  .wd b{display:block;font-size:15px;margin-top:2px}
  .wd.ok{border-color:rgba(46,204,113,.6)}.wd.no{border-color:rgba(255,91,107,.6)}
  .pstats{display:flex;gap:10px;flex-wrap:wrap;margin-top:8px}
  .pbtns{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
  .pbtns .btn{margin-top:0;flex:1;min-width:130px;padding:10px;font-size:14px}
  .toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(120%);background:var(--panel2);
    border:1px solid var(--accent);border-radius:12px;padding:10px 18px;font-weight:700;transition:.3s;z-index:9}
  .toast.show{transform:translateX(-50%) translateY(0)}
  .err{color:var(--red);text-align:center;padding:20px}
  footer{text-align:center;color:var(--muted);font-size:11.5px;margin-top:24px;opacity:.7}
  @media(max-width:520px){.vhead .d{flex-basis:100%}}
</style>
</head>
<body>
<div class="wrap">
  <header><div class="logo">📘 國中英文每日任務<small>DAILY ENGLISH · CLICK TO ANSWER</small></div></header>

  <div class="card board" id="board">
    <div class="stat"><div class="n" id="bBal">$0</div><div class="l">目前餘額（含利息）</div></div>
    <div class="stat"><div class="n" id="bMon">$0</div><div class="l">本月已入帳 / 約6000</div></div>
    <div class="stat"><div class="n" id="bRed">$0</div><div class="l">已兌現總額</div></div>
    <div class="redeem-row">
      <input type="number" id="redeemAmt" class="redeem-in" min="0" step="1" placeholder="金額" inputmode="decimal">
      <button class="redeem-btn" id="redeemBtn">💰 領取</button>
    </div>
    <div class="hint" id="boardHint"></div>
  </div>

  <div class="card" id="makeupCard" style="display:none"></div>

  <div class="card" id="progCard"></div>

  <div class="card" id="quizCard"><div class="err" id="loading">載入今日測驗中…</div></div>
  <footer>零用金存於此瀏覽器 · 每平日 20:00 由排程自動更新題目 · 保留餘額以 18%/年（月複利）滾存<br>週一~週五未完成的任務可於當週內補做，逾週日 23:55 未完成即取消</footer>
</div>
<div class="toast" id="toast"></div>

<script>
const LKEY="g8_allowance_v1", DONE_PREFIX="g8_done_";
const MONTH_RATE=0.18/12, PASS=13, TOTAL=15, REWARD=300;
const $=id=>document.getElementById(id);
function todayStr(){const d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");}
function dateStr(d){return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");}
function monthKey(s){return s.slice(0,7);}
/* ---------- 週一~週五補考規則：當週內可補做，週日23:55後取消 ---------- */
function getMonday(d){const day=d.getDay();const diff=(day===0?-6:1-day);return new Date(d.getFullYear(),d.getMonth(),d.getDate()+diff);}
function isMakeupOpen(now){if(now.getDay()!==0)return true;return now.getHours()<23||(now.getHours()===23&&now.getMinutes()<55);}
function toast(m){const t=$("toast");t.textContent=m;t.classList.add("show");setTimeout(()=>t.classList.remove("show"),1900);}
function escapeHtml(s){return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");}

/* ---------- 語音播放（Web Speech API） ---------- */
let VOICE=null;
function pickVoice(){const vs=speechSynthesis.getVoices();VOICE=vs.find(v=>/en[-_]US/i.test(v.lang))||vs.find(v=>/^en/i.test(v.lang))||null;}
if('speechSynthesis' in window){pickVoice();speechSynthesis.onvoiceschanged=pickVoice;}
function speak(text){try{if(!('speechSynthesis' in window)){toast("此瀏覽器不支援語音");return;}
  speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(text);u.lang="en-US";u.rate=.92;if(VOICE)u.voice=VOICE;speechSynthesis.speak(u);}catch(e){}}

/* ---------- 零用金帳本（localStorage） ---------- */
function loadL(){try{const l=JSON.parse(localStorage.getItem(LKEY));if(l&&typeof l.balance==="number")return l;}catch(e){}
  return {balance:0,lastInterest:todayStr(),redeemed:0,earned:[],redeemMonths:[]};}
function saveL(l){localStorage.setItem(LKEY,JSON.stringify(l));}
function monthsBetween(a,b){const [ay,am,ad]=a.split("-").map(Number),[by,bm,bd]=b.split("-").map(Number);
  let m=(by-ay)*12+(bm-am);if(bd<ad)m-=1;return Math.max(0,m);}
function applyInterest(l){const t=todayStr();const m=monthsBetween(l.lastInterest,t);
  if(m>=1&&l.balance>0){l.balance=Math.round(l.balance*Math.pow(1+MONTH_RATE,m)*100)/100;
    let [y,mo]=l.lastInterest.split("-").map(Number);mo+=m;y+=Math.floor((mo-1)/12);mo=((mo-1)%12)+1;
    l.lastInterest=y+"-"+String(mo).padStart(2,"0")+"-"+l.lastInterest.slice(8);}
  return l;}
function renderBoard(){let l=applyInterest(loadL());saveL(l);const tm=monthKey(todayStr());
  const monEarned=l.earned.filter(d=>monthKey(d)===tm).length*REWARD;
  $("bBal").textContent="$"+l.balance.toFixed(2);$("bMon").textContent="$"+monEarned;$("bRed").textContent="$"+l.redeemed.toFixed(2);
  const done=l.redeemMonths.includes(tm),rb=$("redeemBtn"),ri=$("redeemAmt");
  rb.disabled=done||l.balance<=0; ri.disabled=done||l.balance<=0;
  if(document.activeElement!==ri){ ri.value = (!done&&l.balance>0)? l.balance.toFixed(2):""; }
  rb.textContent=done?"本月已領取":"💰 領取";
  if(typeof renderProgress==="function"&&$("progCard")&&$("progCard").innerHTML)renderProgress();
  $("boardHint").textContent=done?"本月已兌現，下月可再領；保留餘額以18%/年（月複利）滾存。":"每月可領一次、可自訂金額（不必全領）；保留餘額以 18%/年（月複利）滾存。";}
$("redeemBtn").onclick=()=>{let l=applyInterest(loadL());const tm=monthKey(todayStr());
  if(l.redeemMonths.includes(tm)){toast("本月已領取過");return;}
  if(l.balance<=0){toast("目前沒有可領的餘額");return;}
  let amt=parseFloat($("redeemAmt").value);
  if(isNaN(amt)||amt<=0){toast("請輸入要領取的金額");return;}
  amt=Math.round(amt*100)/100;
  if(amt>l.balance){toast("金額超過餘額（$"+l.balance.toFixed(2)+"）");return;}
  l.redeemed=Math.round((l.redeemed+amt)*100)/100;
  l.balance=Math.round((l.balance-amt)*100)/100;
  l.redeemMonths.push(tm); saveL(l); renderBoard();
  toast("已領取 $"+amt.toFixed(2)+"，保留 $"+l.balance.toFixed(2)+" 續以18%滾存");};
function earn(date){let l=applyInterest(loadL());if(l.earned.includes(date)){renderBoard();return false;}
  l.earned.push(date);l.balance=Math.round((l.balance+REWARD)*100)/100;saveL(l);renderBoard();return true;}

/* ---------- 作答紀錄與進度（分享給家長／備份還原） ---------- */
const HKEY="g8_history_v1";
function loadH(){try{const h=JSON.parse(localStorage.getItem(HKEY));if(Array.isArray(h))return h;}catch(e){}return [];}
function logAttempt(o){const h=loadH();h.push(o);try{localStorage.setItem(HKEY,JSON.stringify(h.slice(-150)));}catch(e){}}
function snapshot(){return {v:1,t:Date.now(),l:applyInterest(loadL()),h:loadH()};}
function enc(o){return btoa(unescape(encodeURIComponent(JSON.stringify(o)))).replace(/\+/g,"-").replace(/\//g,"_").replace(/=+$/,"");}
function dec(c){c=c.trim();const i=c.indexOf("#view=");if(i>=0)c=c.slice(i+6);
  c=c.replace(/-/g,"+").replace(/_/g,"/");while(c.length%4)c+="=";
  const o=JSON.parse(decodeURIComponent(escape(atob(c))));
  if(!o||!o.l||typeof o.l.balance!=="number"||!Array.isArray(o.l.earned))throw new Error("bad");
  if(!Array.isArray(o.h))o.h=[];return o;}
function fmtTime(ts){const d=new Date(ts);return dateStr(d)+" "+String(d.getHours()).padStart(2,"0")+":"+String(d.getMinutes()).padStart(2,"0");}
function progressHtml(sn,readonly){
  const l=sn.l,h=sn.h,asOf=new Date(sn.t),tm=monthKey(dateStr(asOf)),asOfDay=dateStr(asOf);
  const monDays=l.earned.filter(d=>monthKey(d)===tm).length;
  let s='<div class="pstats">'+
    '<div class="stat"><div class="n">'+l.earned.length+' 天</div><div class="l">累計達標</div></div>'+
    '<div class="stat"><div class="n">'+monDays+' 天</div><div class="l">本月達標</div></div>'+
    '<div class="stat"><div class="n">$'+l.balance.toFixed(2)+'</div><div class="l">目前餘額（含利息）</div></div>'+
    '<div class="stat"><div class="n">$'+l.redeemed.toFixed(2)+'</div><div class="l">已兌現總額</div></div></div>';
  // 本週一~五
  const mon=getMonday(asOf),WN=["一","二","三","四","五"];
  s+='<div class="sub" style="margin-top:12px">本週任務</div><div class="week">';
  for(let i=0;i<5;i++){const ds=dateStr(new Date(mon.getFullYear(),mon.getMonth(),mon.getDate()+i));
    const tries=h.filter(x=>x.d===ds),best=tries.reduce((m,x)=>Math.max(m,x.s),-1);
    let cls="",txt="—";
    if(l.earned.includes(ds)){cls="ok";txt="✅"+(best>=0?" "+best:"");}
    else if(best>=0){cls="no";txt="❌ "+best;}
    else if(ds<=asOfDay){txt="未做";}
    s+='<div class="wd '+cls+'">週'+WN[i]+' '+ds.slice(5)+'<b>'+txt+'</b></div>';}
  s+='</div>';
  // 最近作答
  const rec=h.slice().sort((a,b)=>b.at-a.at).slice(0,20);
  s+='<div class="sub" style="margin-top:12px">最近作答紀錄'+(rec.length?"":"（尚無；自本功能上線後開始記錄分數）")+'</div>';
  if(rec.length){s+='<div class="pscroll"><table class="ptable"><tr><th>題目日期</th><th>作答時間</th><th>分數</th><th>閱讀/文法/單字</th><th>結果</th></tr>'+
    rec.map(x=>'<tr><td>'+escapeHtml(x.d)+'</td><td>'+fmtTime(x.at)+'</td><td><b>'+x.s+'</b> / '+TOTAL+'</td><td>'+x.r+' / '+x.g+' / '+x.v+'</td><td>'+
      (x.p?(x.e?'✅ 達標入帳':'✅ 達標（練習）'):'❌ 未達標')+'</td></tr>').join("")+'</table></div>';}
  const legacy=l.earned.filter(d=>!h.some(x=>x.d===d&&x.p)).length;
  if(legacy)s+='<div class="hint" style="text-align:left">另有 '+legacy+' 天為功能上線前的達標紀錄（無分數明細）。</div>';
  s+='<div class="hint" style="text-align:left">資料時間：'+fmtTime(sn.t)+'</div>';
  if(!readonly)s+='<div class="pbtns"><button class="btn" id="shareBtn">📤 分享進度給家長</button>'+
    '<button class="btn ghost" id="backupBtn">💾 複製備份碼</button><button class="btn ghost" id="restoreBtn">♻️ 還原備份</button></div>';
  return s;}
async function copyText(t,okMsg){try{await navigator.clipboard.writeText(t);toast(okMsg);}catch(e){prompt("請長按全選後複製：",t);}}
function renderProgress(){const pc=$("progCard");if(!pc)return;const sn=snapshot();
  const open=pc.querySelector("details")?pc.querySelector("details").open:false;
  pc.innerHTML='<details'+(open?" open":"")+' style="margin-top:0"><summary>📊 學習進度與紀錄（可分享給家長）</summary><div class="dbody">'+progressHtml(sn,false)+'</div></details>';
  $("shareBtn").onclick=async()=>{const sn=snapshot(),l=sn.l;
    const url=location.origin+location.pathname+"#view="+enc(sn);
    const text="📘 英文每日任務進度（"+fmtTime(sn.t)+"）\n累計達標 "+l.earned.length+" 天｜餘額 $"+l.balance.toFixed(2)+"｜已兌現 $"+l.redeemed.toFixed(2)+"\n點連結看明細：\n"+url;
    if(navigator.share){try{await navigator.share({text});return;}catch(e){if(e&&e.name==="AbortError")return;}}
    copyText(text,"進度已複製，貼到 LINE 傳給家長");};
  $("backupBtn").onclick=()=>copyText(enc(snapshot()),"備份碼已複製，請貼到安全的地方保存");
  $("restoreBtn").onclick=()=>{const c=prompt("貼上備份碼（或分享連結）：");if(!c)return;let o;
    try{o=dec(c);}catch(e){toast("備份碼無法辨識");return;}
    if(!confirm("將以備份（"+fmtTime(o.t)+"，餘額 $"+o.l.balance.toFixed(2)+"）覆蓋此裝置目前的紀錄，確定？"))return;
    saveL(o.l);localStorage.setItem(HKEY,JSON.stringify(o.h));
    o.l.earned.forEach(d=>localStorage.setItem(DONE_PREFIX+d,"1"));
    renderBoard();renderProgress();renderMakeup();toast("已還原備份");};}
function renderParentView(code){let sn;
  ["board","makeupCard","quizCard"].forEach(id=>{$(id).style.display="none";});
  try{sn=dec(code);}catch(e){$("progCard").innerHTML='<div class="err">連結內容無法讀取，請孩子重新分享一次。</div>';return;}
  $("progCard").innerHTML='<span class="badge">👨‍👩‍👧 家長檢視（唯讀）</span><h2>孩子的學習進度</h2>'+progressHtml(sn,true)+
    '<div class="hint" style="text-align:left">這是孩子分享當下的紀錄；要看最新進度請孩子再分享一次。</div>'+
    '<div class="pbtns"><button class="btn ghost" onclick="location.href=location.pathname">前往做題頁</button></div>';}

/* ---------- 測驗 ---------- */
let QUIZ=null, FLAT=[], picks=[], graded=false;
const KEYS=["A","B","C","D","E"];
const SECMETA={reading:{label:"📖 閱讀理解",cls:"reading"},grammar:{label:"📐 文法測驗",cls:"grammar"},vocab:{label:"🔑 單字測驗",cls:"vocab"}};

async function loadQuiz(){
  try{const r=await fetch("daily/latest.json?t="+Date.now());if(!r.ok)throw new Error("HTTP "+r.status);
    QUIZ=await r.json();renderQuiz();
  }catch(e){$("quizCard").innerHTML='<div class="err">😢 載入今日測驗失敗（'+e.message+'）。排程尚未產生今日題目，或稍後再試。</div>';}
}
async function loadQuizForDate(ds){
  try{const r=await fetch("daily/"+ds+".json?t="+Date.now());if(!r.ok)throw new Error("HTTP "+r.status);
    QUIZ=await r.json();renderQuiz();$("quizCard").scrollIntoView({behavior:"smooth"});
  }catch(e){toast("補考題目載入失敗");}
}
/* 本週（週一~週五）尚未完成、且未過週日23:55截止的補考項目 */
async function renderMakeup(){
  const mc=$("makeupCard");if(!mc)return;
  const now=new Date();
  if(!isMakeupOpen(now)){mc.style.display="none";return;}
  const monday=getMonday(now);const td=todayStr();const candidates=[];
  for(let i=0;i<5;i++){const d=new Date(monday.getFullYear(),monday.getMonth(),monday.getDate()+i);const ds=dateStr(d);
    if(ds>=td)continue; // 只補「今天以前」的平日，今天的就是主測驗
    if(localStorage.getItem(DONE_PREFIX+ds)==="1")continue; // 已完成過的不用補
    candidates.push(ds);}
  if(candidates.length===0){mc.style.display="none";return;}
  const results=await Promise.all(candidates.map(async ds=>{
    try{const r=await fetch("daily/"+ds+".json?t="+Date.now());if(!r.ok)return null;const j=await r.json();return{ds,title:j.title};}
    catch(e){return null;}}));
  const items=results.filter(Boolean);
  if(items.length===0){mc.style.display="none";return;}
  mc.style.display="";
  mc.innerHTML='<div class="badge">📋 本週可補考（週日 23:55 前完成，逾期取消）</div>'+
    items.map(it=>'<div class="makeup-item" data-date="'+it.ds+'"><span>🗓 '+it.ds+'　'+escapeHtml(it.title)+'</span><span class="go">補做 →</span></div>').join("");
  mc.querySelectorAll(".makeup-item").forEach(el=>el.onclick=()=>loadQuizForDate(el.dataset.date));
}
function buildFlat(){
  FLAT=[];
  const s=QUIZ.sections;
  if(s){["reading","grammar","vocab"].forEach(sec=>{(s[sec]||[]).forEach(q=>FLAT.push(Object.assign({_sec:sec},q)));});}
  else if(QUIZ.questions){QUIZ.questions.forEach(q=>FLAT.push(Object.assign({_sec:"reading"},q)));} // 舊格式相容
}
function renderQuiz(){
  graded=false; buildFlat(); picks=new Array(FLAT.length).fill(-1);
  const done=localStorage.getItem(DONE_PREFIX+QUIZ.date)==="1";
  let h="";
  h+='<span class="badge">📅 '+QUIZ.date+'</span> <span class="badge">'+(QUIZ.level||"")+'</span>';
  h+='<h2>'+escapeHtml(QUIZ.title)+'</h2>';
  if(QUIZ.note)h+='<div class="sub">'+escapeHtml(QUIZ.note)+'</div>';
  if(QUIZ.date!==todayStr())h+='<div class="sub" style="color:var(--purple)">🗓 這是補考題目（'+QUIZ.date+'），週日 23:55 前完成仍可入帳。 <button class="btn ghost back-btn" onclick="loadQuiz()">🔙 回到今日測驗</button></div>';
  if(done)h+='<div class="sub" style="color:var(--gold)">✅ 已完成並入帳，可再練習但不重複計酬。</div>';
  h+='<div class="passage">'+escapeHtml(QUIZ.passage)+'</div>';
  // 單字表（含例句與播音）
  if(QUIZ.vocab&&QUIZ.vocab.length){
    h+='<details open><summary>🔑 重點單字 ('+QUIZ.vocab.length+')　🔊 可點播音</summary><div class="dbody">';
    QUIZ.vocab.forEach(v=>{
      h+='<div class="vcard"><div class="vhead">'+
         '<button class="spk" data-say="'+escapeHtml(v.w)+'" title="唸單字">🔊</button>'+
         '<b>'+escapeHtml(v.w)+'</b> <span class="pos">'+escapeHtml(v.pos||"")+'</span> <span class="d">'+escapeHtml(v.d||"")+'</span></div>';
      if(v.example)h+='<div class="vex"><button class="spk" data-say="'+escapeHtml(v.example)+'" title="唸例句">🔊</button><span>'+escapeHtml(v.example)+'</span></div>';
      h+='</div>';
    });
    h+='</div></details>';
  }
  if(QUIZ.grammar&&QUIZ.grammar.length){h+='<details><summary>📐 文法重點</summary><div class="dbody">'+QUIZ.grammar.map(g=>'<div class="gr">• '+escapeHtml(g)+'</div>').join("")+'</div></details>';}
  // 三個分區
  let gi=0, lastSec=null;
  FLAT.forEach((q,i)=>{
    if(q._sec!==lastSec){lastSec=q._sec;const m=SECMETA[q._sec];
      const cnt=FLAT.filter(x=>x._sec===q._sec).length;
      h+='<div class="sec"><div class="sec-h '+m.cls+'">'+m.label+'<span class="cnt">'+cnt+' 題</span></div></div>';}
    h+='<div class="q" data-qi="'+i+'"><div class="q-h"><span class="num">'+(i+1)+'</span>'+escapeHtml(q.q)+'</div>';
    q.opts.forEach((o,k)=>{h+='<div class="opt" data-qi="'+i+'" data-k="'+k+'"><span class="k">'+KEYS[k]+'</span><span>'+escapeHtml(o)+'</span></div>';});
    h+='<div class="ex" id="ex'+i+'"></div></div>';
  });
  h+='<div class="subcount" id="subcount"></div><button class="btn" id="submitBtn" disabled>送出答案並批改</button><div class="result" id="result"></div>';
  $("quizCard").innerHTML=h;
  $("quizCard").querySelectorAll(".opt").forEach(el=>el.onclick=()=>selectOpt(el));
  $("quizCard").querySelectorAll(".spk").forEach(el=>el.onclick=e=>{e.stopPropagation();speak(el.dataset.say);});
  $("submitBtn").onclick=grade;updateCount();
}
function updateCount(){const done=picks.filter(p=>p>=0).length;$("subcount").textContent="已作答 "+done+" / "+FLAT.length+" 題";$("submitBtn").disabled=done<FLAT.length;}
function selectOpt(el){if(graded)return;const qi=+el.dataset.qi,k=+el.dataset.k;picks[qi]=k;
  $("quizCard").querySelectorAll('.opt[data-qi="'+qi+'"]').forEach(o=>o.classList.toggle("sel",+o.dataset.k===k));updateCount();}
function grade(){
  if(picks.includes(-1)||graded)return;graded=true;
  let correct=0,secScore={reading:0,grammar:0,vocab:0},secTot={reading:0,grammar:0,vocab:0};
  FLAT.forEach((q,i)=>{secTot[q._sec]++;
    const opts=$("quizCard").querySelectorAll('.opt[data-qi="'+i+'"]');
    opts.forEach(o=>{o.classList.add("locked");const k=+o.dataset.k;if(k===q.a)o.classList.add("correct");if(k===picks[i]&&k!==q.a)o.classList.add("wrong");});
    if(picks[i]===q.a){correct++;secScore[q._sec]++;}
    const ex=$("ex"+i);ex.innerHTML=(picks[i]===q.a?"✅ ":"❌ 正解 "+KEYS[q.a]+"：")+escapeHtml(q.ex||"");ex.classList.add("show");});
  const pass=correct>=PASS,firstTime=localStorage.getItem(DONE_PREFIX+QUIZ.date)!=="1";let earned=false;
  if(pass&&firstTime){localStorage.setItem(DONE_PREFIX+QUIZ.date,"1");earned=earn(QUIZ.date);renderMakeup();}
  logAttempt({d:QUIZ.date,at:Date.now(),s:correct,r:secScore.reading,g:secScore.grammar,v:secScore.vocab,p:pass?1:0,e:earned?1:0});renderProgress();
  const res=$("result");res.className="result show "+(pass?"pass":"fail");
  res.innerHTML='<div class="big">'+(pass?"🏆":"💪")+'</div><div class="score">'+correct+' / '+TOTAL+'</div>'+
    '<div class="breakdown">閱讀 '+secScore.reading+'/'+secTot.reading+'　文法 '+secScore.grammar+'/'+secTot.grammar+'　單字 '+secScore.vocab+'/'+secTot.vocab+'</div>'+
    '<div style="margin-top:8px">'+(pass?
      (earned?"太棒了！達標（≥13）入帳 <b style=\"color:var(--gold)\">+$300</b> 零用金！":"已達標（≥13）！（今日稍早已入帳，不重複計酬）"):
      "答對 "+correct+" 題，未達 13 題。可「再試一次」或明天再挑戰。")+'</div>'+
    '<div class="row">'+(pass?"":'<button class="btn ghost" onclick="renderQuiz()">🔄 再試一次</button>')+'</div>';
  $("submitBtn").style.display="none";$("subcount").style.display="none";
  window.scrollTo({top:document.body.scrollHeight,behavior:"smooth"});
}
if(location.hash.indexOf("#view=")===0){renderParentView(location.hash.slice(6));}
else{renderBoard();renderProgress();loadQuiz();renderMakeup();}
</script>
</body>
</html>
