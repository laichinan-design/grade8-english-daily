<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>國中英文每日任務 · 點擊作答</title>
<style>
  :root{--bg:#0f1720;--panel:#182430;--panel2:#1f2e3c;--line:rgba(255,255,255,.12);
    --text:#eef4f8;--muted:#9db1c2;--accent:#3ba0ff;--green:#2ecc71;--red:#ff5b6b;--gold:#ffcf4d;}
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:"Segoe UI","Noto Sans TC","Microsoft JhengHei",system-ui,sans-serif;
    background:linear-gradient(160deg,#0f1720,#10202c 60%,#0c1a24);color:var(--text);
    min-height:100vh;line-height:1.7;-webkit-font-smoothing:antialiased}
  .wrap{max-width:820px;margin:0 auto;padding:20px 16px 80px}
  header{text-align:center;padding:10px 0 6px}
  .logo{font-size:24px;font-weight:800;letter-spacing:1px}
  .logo small{display:block;font-size:12px;color:var(--muted);font-weight:600;margin-top:2px;letter-spacing:2px}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:18px;margin-top:16px;
    box-shadow:0 12px 40px rgba(0,0,0,.35)}
  /* 零用金看板 */
  .board{display:flex;gap:10px;flex-wrap:wrap;align-items:center;background:linear-gradient(90deg,#183042,#1c2a3a);
    border:1px solid rgba(59,160,255,.35)}
  .stat{flex:1;min-width:120px;text-align:center}
  .stat .n{font-size:22px;font-weight:800;color:var(--gold)}
  .stat .l{font-size:11.5px;color:var(--muted)}
  .redeem-btn{background:var(--gold);color:#3a2c00;border:none;border-radius:10px;padding:9px 14px;
    font-weight:800;cursor:pointer;font-size:13px}
  .redeem-btn:disabled{opacity:.5;cursor:not-allowed}
  .hint{color:var(--muted);font-size:12px;flex-basis:100%;text-align:center;margin-top:2px}
  .badge{display:inline-block;font-size:12px;font-weight:700;padding:3px 10px;border-radius:99px;
    background:rgba(59,160,255,.2);border:1px solid rgba(59,160,255,.5);color:#bfe0ff}
  h2{font-size:20px;margin:8px 0 2px}
  .sub{color:var(--muted);font-size:13px;margin-bottom:8px}
  .passage{white-space:pre-wrap;font-size:15.5px;line-height:1.95;text-align:justify;
    background:rgba(0,0,0,.2);border:1px solid var(--line);border-radius:12px;padding:14px;margin-top:8px}
  details{margin-top:12px;border:1px solid var(--line);border-radius:12px;overflow:hidden;background:rgba(0,0,0,.15)}
  details summary{cursor:pointer;padding:10px 14px;font-weight:700;color:var(--gold);list-style:none}
  details summary::-webkit-details-marker{display:none}
  .dbody{padding:0 14px 12px}
  .voc{display:grid;grid-template-columns:1fr 1fr;gap:4px 16px;font-size:14px}
  .voc div{border-bottom:1px dashed var(--line);padding:4px 0}
  .voc b{color:#7fd3ff}
  .gr{font-size:14px;margin:4px 0;padding-left:6px}
  /* 題目 */
  .q{margin-top:16px;padding-top:14px;border-top:1px dashed var(--line)}
  .q-h{font-weight:700;font-size:16px;margin-bottom:10px}
  .q-h .num{display:inline-grid;place-items:center;width:24px;height:24px;border-radius:50%;
    background:var(--accent);color:#04203a;font-size:13px;font-weight:800;margin-right:8px}
  .opt{display:flex;gap:10px;align-items:flex-start;border:1px solid var(--line);border-radius:11px;
    padding:11px 13px;margin:8px 0;cursor:pointer;background:var(--panel2);transition:.12s}
  .opt:hover{border-color:var(--accent)}
  .opt .k{width:24px;height:24px;flex:none;border-radius:7px;background:rgba(255,255,255,.1);
    display:grid;place-items:center;font-weight:800;font-size:13px}
  .opt.sel{border-color:var(--accent);background:rgba(59,160,255,.14)}
  .opt.correct{border-color:var(--green);background:rgba(46,204,113,.16)}
  .opt.correct .k{background:var(--green);color:#053}
  .opt.wrong{border-color:var(--red);background:rgba(255,91,107,.16)}
  .opt.wrong .k{background:var(--red)}
  .opt.locked{cursor:default}
  .ex{display:none;font-size:13.5px;color:var(--muted);margin-top:6px;padding:8px 10px;
    background:rgba(0,0,0,.22);border-radius:8px}
  .ex.show{display:block}
  .btn{display:block;width:100%;margin-top:18px;border:none;border-radius:12px;padding:14px;
    font-size:16px;font-weight:800;cursor:pointer;color:#04203a;
    background:linear-gradient(90deg,var(--accent),#63c0ff)}
  .btn:disabled{opacity:.5;cursor:not-allowed}
  .btn.ghost{background:transparent;border:1px solid var(--line);color:var(--text)}
  .result{text-align:center;margin-top:16px;padding:16px;border-radius:14px;display:none}
  .result.show{display:block}
  .result.pass{background:rgba(46,204,113,.14);border:1px solid rgba(46,204,113,.5)}
  .result.fail{background:rgba(255,91,107,.14);border:1px solid rgba(255,91,107,.5)}
  .result .big{font-size:40px}
  .result .score{font-size:26px;font-weight:800;color:var(--gold)}
  .row{display:flex;gap:10px;margin-top:12px}
  .row .btn{margin-top:0}
  .toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(120%);
    background:var(--panel2);border:1px solid var(--accent);border-radius:12px;padding:10px 18px;
    font-weight:700;transition:.3s;z-index:9}
  .toast.show{transform:translateX(-50%) translateY(0)}
  .err{color:var(--red);text-align:center;padding:20px}
  footer{text-align:center;color:var(--muted);font-size:11.5px;margin-top:24px;opacity:.7}
  @media(max-width:520px){.voc{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="logo">📘 國中英文每日任務<small>DAILY ENGLISH · CLICK TO ANSWER</small></div>
  </header>

  <!-- 零用金看板 -->
  <div class="card board" id="board">
    <div class="stat"><div class="n" id="bBal">$0</div><div class="l">目前餘額（含利息）</div></div>
    <div class="stat"><div class="n" id="bMon">$0</div><div class="l">本月已入帳 / 約2000</div></div>
    <div class="stat"><div class="n" id="bRed">$0</div><div class="l">已兌現總額</div></div>
    <button class="redeem-btn" id="redeemBtn">💰 領取本月零用金</button>
    <div class="hint" id="boardHint"></div>
  </div>

  <!-- 測驗 -->
  <div class="card" id="quizCard">
    <div class="err" id="loading">載入今日測驗中…</div>
  </div>

  <footer>零用金存於此瀏覽器 · 每平日 20:00 由排程自動更新題目 · 未領餘額以 10%/年（月複利）滾存</footer>
</div>
<div class="toast" id="toast"></div>

<script>
const LKEY="g8_allowance_v1", DONE_PREFIX="g8_done_"; // g8_done_<date>=1 表示該日已入帳
const MONTH_RATE=0.10/12, PASS=8, REWARD=100;
const $=id=>document.getElementById(id);
function todayStr(){const d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");}
function monthKey(s){return s.slice(0,7);}
function toast(m){const t=$("toast");t.textContent=m;t.classList.add("show");setTimeout(()=>t.classList.remove("show"),1900);}

/* ---------- 零用金帳本（localStorage） ---------- */
function loadL(){try{const l=JSON.parse(localStorage.getItem(LKEY));if(l&&typeof l.balance==="number")return l;}catch(e){}
  return {balance:0,lastInterest:todayStr(),redeemed:0,earned:[],redeemMonths:[]};}
function saveL(l){localStorage.setItem(LKEY,JSON.stringify(l));}
function monthsBetween(a,b){const [ay,am,ad]=a.split("-").map(Number),[by,bm,bd]=b.split("-").map(Number);
  let m=(by-ay)*12+(bm-am);if(bd<ad)m-=1;return Math.max(0,m);}
function applyInterest(l){const t=todayStr();const m=monthsBetween(l.lastInterest,t);
  if(m>=1&&l.balance>0){l.balance=Math.round(l.balance*Math.pow(1+MONTH_RATE,m)*100)/100;
    // 上次計息日往後推 m 個月
    let [y,mo]=l.lastInterest.split("-").map(Number);mo+=m;y+=Math.floor((mo-1)/12);mo=((mo-1)%12)+1;
    l.lastInterest=y+"-"+String(mo).padStart(2,"0")+"-"+l.lastInterest.slice(8);}
  return l;}
function renderBoard(){let l=applyInterest(loadL());saveL(l);
  const tm=monthKey(todayStr());
  const monEarned=l.earned.filter(d=>monthKey(d)===tm).length*REWARD;
  $("bBal").textContent="$"+l.balance.toFixed(2);
  $("bMon").textContent="$"+monEarned;
  $("bRed").textContent="$"+l.redeemed.toFixed(2);
  const redeemedThisMonth=l.redeemMonths.includes(tm);
  const rb=$("redeemBtn");
  rb.disabled=redeemedThisMonth||l.balance<=0;
  rb.textContent=redeemedThisMonth?"本月已領取":"💰 領取本月零用金";
  $("boardHint").textContent=redeemedThisMonth?"本月已兌現，下月可再領；未領餘額持續以10%/年月複利滾存。"
    :"每月可領一次；不領則以 10%/年（月複利）滾存。";
}
$("redeemBtn").onclick=()=>{let l=applyInterest(loadL());const tm=monthKey(todayStr());
  if(l.redeemMonths.includes(tm)){toast("本月已領取過");return;}
  if(l.balance<=0){toast("目前沒有可領的餘額");return;}
  const amt=l.balance;l.redeemed=Math.round((l.redeemed+amt)*100)/100;l.balance=0;
  l.lastInterest=todayStr();l.redeemMonths.push(tm);saveL(l);renderBoard();
  toast("已領取 $"+amt.toFixed(2)+" 零用金！");};

function earn(date){let l=applyInterest(loadL());
  if(l.earned.includes(date)){renderBoard();return false;} // 當日已入帳
  l.earned.push(date);l.balance=Math.round((l.balance+REWARD)*100)/100;saveL(l);renderBoard();return true;}

/* ---------- 測驗 ---------- */
let QUIZ=null, picks=[], graded=false;
const KEYS=["A","B","C","D","E"];

async function loadQuiz(){
  try{
    const r=await fetch("daily/latest.json?t="+Date.now());
    if(!r.ok) throw new Error("HTTP "+r.status);
    QUIZ=await r.json();
    renderQuiz();
  }catch(e){
    $("quizCard").innerHTML='<div class="err">😢 載入今日測驗失敗（'+e.message+'）。<br>排程尚未產生今日題目，或稍後再試。</div>';
  }
}

function renderQuiz(){
  graded=false; picks=new Array(QUIZ.questions.length).fill(-1);
  const alreadyDone=localStorage.getItem(DONE_PREFIX+QUIZ.date)==="1";
  let html="";
  html+='<span class="badge">📅 '+QUIZ.date+'</span> <span class="badge">'+ (QUIZ.level||"") +'</span>';
  html+='<h2>'+QUIZ.title+'</h2>';
  if(QUIZ.note) html+='<div class="sub">'+QUIZ.note+'</div>';
  if(alreadyDone) html+='<div class="sub" style="color:var(--gold)">✅ 今天已完成並入帳，可再練習但不重複計酬。</div>';
  html+='<div class="passage">'+escapeHtml(QUIZ.passage)+'</div>';
  // 單字
  if(QUIZ.vocab&&QUIZ.vocab.length){html+='<details><summary>🔑 重點單字 ('+QUIZ.vocab.length+')</summary><div class="dbody"><div class="voc">'+
    QUIZ.vocab.map(v=>'<div><b>'+v.w+'</b> <span style="color:var(--muted)">'+(v.pos||"")+'</span> '+v.d+'</div>').join("")+'</div></div></details>';}
  // 文法
  if(QUIZ.grammar&&QUIZ.grammar.length){html+='<details><summary>📐 文法重點</summary><div class="dbody">'+
    QUIZ.grammar.map(g=>'<div class="gr">• '+g+'</div>').join("")+'</div></details>';}
  // 題目
  QUIZ.questions.forEach((q,i)=>{
    html+='<div class="q" data-qi="'+i+'"><div class="q-h"><span class="num">'+(i+1)+'</span>'+escapeHtml(q.q)+'</div>';
    q.opts.forEach((o,k)=>{html+='<div class="opt" data-qi="'+i+'" data-k="'+k+'"><span class="k">'+KEYS[k]+'</span><span>'+escapeHtml(o)+'</span></div>';});
    html+='<div class="ex" id="ex'+i+'"></div></div>';
  });
  html+='<button class="btn" id="submitBtn" disabled>送出答案並批改</button>';
  html+='<div class="result" id="result"></div>';
  $("quizCard").innerHTML=html;
  $("quizCard").querySelectorAll(".opt").forEach(el=>el.onclick=()=>selectOpt(el));
  $("submitBtn").onclick=grade;
}
function escapeHtml(s){return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");}
function selectOpt(el){
  if(graded)return;
  const qi=+el.dataset.qi,k=+el.dataset.k;
  picks[qi]=k;
  $("quizCard").querySelectorAll('.opt[data-qi="'+qi+'"]').forEach(o=>o.classList.toggle("sel",+o.dataset.k===k));
  $("submitBtn").disabled=picks.includes(-1);
}
function grade(){
  if(picks.includes(-1)||graded)return;
  graded=true;
  let correct=0;
  QUIZ.questions.forEach((q,i)=>{
    const opts=$("quizCard").querySelectorAll('.opt[data-qi="'+i+'"]');
    opts.forEach(o=>{o.classList.add("locked");const k=+o.dataset.k;
      if(k===q.a)o.classList.add("correct");
      if(k===picks[i]&&k!==q.a)o.classList.add("wrong");});
    if(picks[i]===q.a)correct++;
    const ex=$("ex"+i);ex.innerHTML=(picks[i]===q.a?"✅ ":"❌ 正解 "+KEYS[q.a]+"：")+escapeHtml(q.ex||"");ex.classList.add("show");
  });
  const pass=correct>=PASS;
  const firstTime=localStorage.getItem(DONE_PREFIX+QUIZ.date)!=="1";
  let earned=false;
  if(pass&&firstTime){localStorage.setItem(DONE_PREFIX+QUIZ.date,"1");earned=earn(QUIZ.date);}
  const res=$("result");res.className="result show "+(pass?"pass":"fail");
  res.innerHTML='<div class="big">'+(pass?"🏆":"💪")+'</div><div class="score">'+correct+' / 10</div>'+
    '<div style="margin-top:6px">'+(pass?
      (earned?"太棒了！答對 "+correct+" 題，達標入帳 <b style=\"color:var(--gold)\">+$100</b> 零用金！":
        "答對 "+correct+" 題，已達標！（今日稍早已入帳，不重複計酬）"):
      "答對 "+correct+" 題，未達 8 題。可「再試一次」或明天再挑戰。")+'</div>'+
    '<div class="row">'+(pass?"":'<button class="btn ghost" onclick="renderQuiz()">🔄 再試一次</button>')+
    '</div>';
  $("submitBtn").style.display="none";
  window.scrollTo({top:document.body.scrollHeight,behavior:"smooth"});
}

renderBoard();
loadQuiz();
</script>
</body>
</html>
